# 検査ロジックの正本は caty-ai/family-dev-handbook の reusable workflow。
# ci-v1 ピン・#114 で caller 化・ローカルコピー廃止。
# 型の正本は handbook templates/ci/。
name: PR Size
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, edited]
permissions: {contents: read}
concurrency: {group: 'pr-size-${{ github.event.pull_request.number }}', cancel-in-progress: true}
jobs:
  pr-size:
    uses: caty-ai/family-dev-handbook/.github/workflows/reusable-pr-size.yml@0e8eceee64b2c5a25e47d15fb4ffbead491e0479 # ci-v1
    permissions: {contents: read, pull-requests: write}
    with:
      max_lines: '250'
