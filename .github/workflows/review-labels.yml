# 検査ロジックの正本は caty-ai/family-dev-handbook の reusable workflow。
# ci-v1 ピン・#114 で caller 化・ローカルコピー廃止。
# 型の正本は handbook templates/ci/。
name: Risk Review Gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
permissions: {contents: read}
concurrency: {group: 'risk-review-${{ github.event.pull_request.number }}', cancel-in-progress: true}
jobs:
  risk-review-gate:
    uses: caty-ai/family-dev-handbook/.github/workflows/reusable-review-labels.yml@ci-v1
    permissions: {contents: read, issues: read, pull-requests: write}
    with:
      risk_paths_billing: 'none' # 課金・支出コードなし (#30 で明示宣言)
      risk_paths_outbound: 'none' # 対外送信コード実在なし — curl/wget/webhook 等 grep 確認 (#30 で明示宣言)
      risk_paths_gates: 'none' # Makefile は reusable 側 DEFAULT が覆う・tests/** は一級市民コードで通常レビュー対象 (#30 で明示宣言)
      risk_paths_auth: 'none' # 認証コードなし (handbook#31 v0.9.2 同期の明示宣言)
