name: release-sync
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: 'release-sync-${{ github.ref }}'
  cancel-in-progress: false
jobs:
  release-sync:
    uses: caty-ai/family-dev-handbook/.github/workflows/reusable-release-sync.yml@0e8eceee64b2c5a25e47d15fb4ffbead491e0479 # ci-v1
    # release 作成に contents: write が必要。pin により実行コードは SHA 固定済み。
    permissions: {contents: write}
